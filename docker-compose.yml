
services:

  api:
    build: .
    container_name: predictops-api

    command: >
      python -m uvicorn api.main:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"
      interval: 10s
      timeout: 5s
      retries: 5


  dashboard:
    build: .
    container_name: predictops-dashboard

    command: >
      streamlit run dashboard/app.py
      --server.address=0.0.0.0
      --server.port=8501

    ports:
      - "8502:8501"

    environment:
      - API_URL=http://api:8000

    depends_on:
      api:
        condition: service_healthy
